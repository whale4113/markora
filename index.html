<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f6f5f0"><title>纸间 · 让思绪自然成文</title></head>
<body>
<div id="app">
  <aside id="sidebar" class="sidebar">
    <a class="brand" href="#" aria-label="纸间首页"><span class="brand-mark"><i data-lucide="leaf"></i></span><span>纸间<span class="brand-en">PAPERSPACE</span></span><span class="demo-badge">DEMO</span></a>
    <div class="library-heading"><span>你的写作空间</span><button id="new-doc" class="icon-button" title="新建文档" aria-label="新建文档"><i data-lucide="plus"></i></button></div>
    <div class="search-box"><i data-lucide="search"></i><input id="search-docs" placeholder="搜索文档…" aria-label="搜索文档"><kbd>⌘ K</kbd></div>
    <div class="sidebar-tabs"><button id="tab-files" class="active">文档库</button><button id="tab-outline">文档大纲</button></div>
    <div class="library-label"><span>所有文档</span><i data-lucide="chevron-down"></i></div>
    <nav id="doc-list" class="doc-list" aria-label="文档列表"></nav>
    <nav id="outline-list" class="outline-list" aria-label="文档大纲" hidden></nav>
    <div class="sidebar-bottom"><div class="document-tools"><button id="history-toggle" title="版本历史"><i data-lucide="history"></i>版本历史</button><button id="delete-doc" title="删除当前文档" aria-label="删除当前文档"><i data-lucide="trash-2"></i></button><button id="help-btn" title="功能与使用说明" aria-label="功能与使用说明"><i data-lucide="circle-help"></i></button></div><button id="import-doc" class="import-button"><i data-lucide="upload"></i>导入 Markdown<span>↗</span></button><input type="file" id="import-file" accept=".md,.markdown,.txt,.html" multiple hidden><div class="local-note"><span class="status-dot"></span><span>只在此刻，也只在本地<small>文档自动保存在你的浏览器中</small></span><i data-lucide="lock-keyhole"></i></div></div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div class="breadcrumb"><button id="sidebar-toggle" class="icon-button" title="切换侧栏" aria-label="切换侧栏"><i data-lucide="panel-left"></i></button><span>我的文档</span><i data-lucide="chevron-right"></i><span class="breadcrumb-current">写作工作台</span></div><div class="top-actions"><span id="save-status" class="save-status">已保存</span><span class="top-divider"></span><button id="source-toggle" class="text-button" title="切换 Markdown 源码"><i data-lucide="code-xml"></i><span>源码</span></button><button id="readonly-toggle" class="icon-button" title="阅读模式" aria-label="阅读模式"><i data-lucide="book-open"></i></button><button id="theme-toggle" class="icon-button" title="切换深色主题" aria-label="切换深色主题"><i data-lucide="sun"></i></button><div class="export-wrap"><button id="export-btn" class="export-button"><i data-lucide="download"></i>导出<i data-lucide="chevron-down"></i></button><div id="export-menu" class="dropdown" hidden><button data-export="markdown">Markdown <span>.md</span></button><button data-export="html">网页文档 <span>.html</span></button><button data-export="json">完整文档备份 <span>.json</span></button><button data-export="print">打印 / 保存为 PDF</button></div></div></div></header>
    <div class="format-bar"><div class="format-left"><button data-command="undo" title="撤销 · Ctrl Z" aria-label="撤销"><i data-lucide="undo-2"></i></button><button data-command="redo" title="重做 · Ctrl Shift Z" aria-label="重做"><i data-lucide="redo-2"></i></button><span class="toolbar-divider"></span><select data-command="heading" id="heading-select" class="heading-button" title="切换标题" aria-label="切换标题"><option value="0">正文</option><option value="1">标题 1</option><option value="2">标题 2</option><option value="3">标题 3</option><option value="4">标题 4</option><option value="5">标题 5</option><option value="6">标题 6</option></select><select id="font-size" aria-label="字号"><option value="16">16</option><option value="18" selected>18</option><option value="20">20</option><option value="22">22</option></select><span class="toolbar-divider"></span><button data-command="strong" title="加粗 · Ctrl B" aria-label="加粗"><i data-lucide="bold"></i></button><button data-command="emphasis" title="斜体 · Ctrl I" aria-label="斜体"><i data-lucide="italic"></i></button><button data-command="strikethrough" title="删除线" aria-label="删除线"><i data-lucide="strikethrough"></i></button><button data-command="code" title="行内代码" aria-label="行内代码"><i data-lucide="code"></i></button><span class="toolbar-divider"></span><button data-command="bulletList" title="无序列表" aria-label="无序列表"><i data-lucide="list"></i></button><button data-command="orderedList" title="有序列表" aria-label="有序列表"><i data-lucide="list-ordered"></i></button><button data-command="task" title="任务列表" aria-label="任务列表"><i data-lucide="list-checks"></i></button><button data-command="blockquote" title="引用" aria-label="引用"><i data-lucide="quote"></i></button><span class="toolbar-divider"></span><button data-command="link" title="插入链接 · Ctrl K" aria-label="插入链接"><i data-lucide="link"></i></button><button data-command="image" title="插入图片" aria-label="插入图片"><i data-lucide="image"></i></button><button data-command="table" title="插入表格" aria-label="插入表格"><i data-lucide="table-2"></i></button><div class="insert-wrap"><button id="insert-menu" title="更多插入选项" aria-label="更多插入选项"><i data-lucide="circle-plus"></i></button><div class="insert-options dropdown"><button data-command="codeBlock">代码块 <span>```</span></button><button data-command="math">数学公式 <span>∑</span></button><button data-command="mermaid">Mermaid 流程图</button><button data-command="horizontalRule">分隔线</button><button data-command="footnote">脚注</button></div></div></div><div class="format-right"><button id="find-toggle" title="查找与替换 · Ctrl F" aria-label="查找与替换"><i data-lucide="search"></i></button><button id="typewriter-toggle" title="打字机模式" aria-label="打字机模式"><i data-lucide="align-center"></i></button><button id="focus-toggle" title="专注模式" aria-label="专注模式"><i data-lucide="maximize"></i></button></div></div>
    <section id="find-panel" class="find-panel" hidden><input id="find-input" placeholder="查找文本" aria-label="查找文本"><input id="replace-input" placeholder="替换为" aria-label="替换文本"><button id="find-next">下一处</button><button id="replace-one">替换</button><button id="replace-all">全部替换</button><button id="find-close" class="icon-button" aria-label="关闭查找"><i data-lucide="x"></i></button></section>
    <div class="paper-scroll"><article class="paper"><div class="document-eyebrow"><span class="eyebrow-line"></span>写下值得留下的事</div><input id="input-title" class="document-title" value="欢迎来到纸间" placeholder="无标题文档" aria-label="文档标题"><div class="document-meta"><span><i data-lucide="file-text"></i>Markdown 文档</span><span class="meta-dot">·</span><span>自由书写，自然成文</span></div><div class="title-rule"></div><div id="editor-host"></div><textarea id="source-editor" aria-label="Markdown 源码" spellcheck="false" hidden></textarea><div class="paper-end"><span></span><i data-lucide="leaf"></i><span></span></div></article></div>
    <footer class="statusbar"><div><span class="status-dot"></span><span>本地优先</span><span class="footer-divider">/</span><span>Markdown</span></div><div><span id="cursor-status">准备就绪</span><span class="footer-divider">|</span><span><b id="word-count">0</b> 字</span><span><b id="char-count">0</b> 字符</span><span>阅读约 <b id="reading-time">1</b> 分钟</span><span class="footer-divider">|</span><span>UTF-8</span></div></footer>
  </main>
</div><div id="toast" class="toast" role="status" hidden></div><dialog id="modal"><form id="modal-form"><div class="modal-icon"><i data-lucide="pencil-line"></i></div><h2 id="modal-title"></h2><div id="modal-body"></div><div class="modal-actions"><button id="modal-cancel" type="button">取消</button><button id="modal-submit" type="submit">确定</button></div></form></dialog>
<script type="module" src="/src/main.js"></script>
</body></html>
